<style>
:root{
  /* The page is dark on purpose. Declaring that stops a phone's own dark
     mode from repainting it — forced dark was greying the ivory keys and
     making the keyboard look disabled. */
  color-scheme:dark;

  /* Charcoal ground, warm-neutral ivory, gold kept for accents only. */
  --bg-0:    #0f0e0e;                    /* the floor                  */
  --bg-1:    #252323;                    /* mid                        */
  --bg-2:    #3a3838;                    /* the lift up at the top     */
  --key:     #f4f0e8;
  --key-lit: #cdc9bf;                    /* a struck key reads darker  */
  --blk:     #0a0909;
  --blk-lit: #2b2827;

  /* Ivory at fixed strengths. The type hierarchy is built out of these
     rather than from one-off greys, so contrast stays even everywhere. */
  --ivory:    #f4f0e8;
  --ivory-72: rgba(244,240,232,.72);
  --ivory-45: rgba(244,240,232,.45);
  --ivory-20: rgba(244,240,232,.20);
  --ivory-10: rgba(244,240,232,.10);
  --ivory-06: rgba(244,240,232,.06);

  --brass:    #c9a84c;                   /* the one gold               */
  --gold-dim: rgba(201,168,76,.55);
  --candle:   #ddc478;                   /* brighter gold, focus rings */
  --linen:    var(--ivory);
  --muted:    var(--ivory-45);
  --rule:     rgba(244,240,232,.14);

  --board:   clamp(94px, 24vw, 200px);   /* keyboard width, portrait  */
  --board-x: min(46vw, 268px);           /* ...when expanded          */
  --deck:    clamp(88px, 23vh, 148px);   /* keyboard height, landscape */
  --deck-x:  min(44vh, 208px);           /* ...when expanded          */
  --display: "Bodoni Moda", Georgia, serif;
  --util:    "Jost", system-ui, sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}

body{
  background:var(--bg-0);
  color:var(--linen);
  font-family:var(--util);
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

/* The glow sits high and slightly right, over the card rather than over
   the keys — the same charcoal lift the design calls for, run across the
   whole page so nothing seams at the edge of the stage on a wide screen. */
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  background:
    radial-gradient(ellipse 96% 62% at 58% 3%,
      #3a3838 0%, #2e2b2b 26%, #252323 48%, #1a1919 72%, #0f0e0e 100%);
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:radial-gradient(92% 52% at 58% 110%, rgba(201,168,76,.10), transparent 72%);
}

.stage{
  position:relative;
  z-index:1;
  display:flex;
  max-width:940px;
  margin:0 auto;
  min-height:100svh;
}

/* ============ the keyboard ============ */
/* The rack is the keyboard's footprint in the layout. Expanding widens the
   rack, so the card genuinely makes room rather than being covered over. */
.rack{
  position:sticky;
  top:0;
  align-self:flex-start;
  flex:none;
  width:var(--board);
  height:100svh;
  z-index:3;
  background:var(--blk);
  box-shadow:6px 0 26px rgba(0,0,0,.55);
  transition:width .34s cubic-bezier(.4,0,.2,1);
}
/* nothing to cast from at zero width */
body.keys-hidden .rack{box-shadow:none}
body.keys-open .rack{width:var(--board-x)}
body.keys-hidden .rack{width:0}
/* at zero width the keys leave 1px shadow slivers behind, so take them out */
body.keys-hidden .wkey,
body.keys-hidden .bkey{visibility:hidden}
body.rack-dragging .rack{width:var(--drag-w);transition:none}

/* invisible probes: they resolve the clamp()/min() sizes to real pixels so
   the drag knows what to snap to, and they stay correct on resize */
.probe{
  position:absolute;
  top:0;left:0;
  visibility:hidden;
  pointer-events:none;
}
#probeA{width:var(--board);height:var(--deck)}
#probeB{width:var(--board-x);height:var(--deck-x)}



.board{
  position:absolute;
  inset:0;
  --kstep:calc(100% / var(--n, 14));
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

.wkey,.bkey{
  position:absolute;
  display:block;
  border:0;
  padding:0;
  cursor:pointer;
  font:inherit;
  background:none;
  -webkit-appearance:none;
  appearance:none;
}

/* The keys are painted onto a canvas, not with CSS colours. A phone's
   forced dark mode rewrites CSS backgrounds — flat ones and gradients alike,
   which is what kept greying the keyboard out — but it cannot touch pixels
   already drawn into a canvas. These buttons are invisible; they exist only
   to catch taps and to carry the geometry the canvas paints from. */
#keys{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  display:block;
  z-index:0;
  pointer-events:none;
}

.wkey{
  left:0;
  width:100%;
  top:calc(var(--i) * var(--kstep) + 2px);
  height:calc(var(--kstep) - 4px);
  background:none;
  border:0;
  z-index:1;
}

.bkey{
  right:0;
  width:62%;
  top:calc(var(--b) * var(--kstep) - var(--kstep) * .31);
  height:calc(var(--kstep) * .62);
  background:none;
  border:0;
  z-index:3;
}

.wkey:focus-visible,.bkey:focus-visible{
  outline:2px solid var(--brass);
  outline-offset:-4px;
  z-index:4;
}

/* the pull-tab that makes the keys bigger — a plate mounted on the keyboard's
   edge, with the arrow sitting inside it so nothing appears to float */
.expand{
  position:absolute;
  left:100%;
  top:50%;
  margin-top:-47px;
  width:44px;
  height:94px;
  padding:0;
  cursor:ew-resize;
  touch-action:none;
  z-index:6;
  background:linear-gradient(180deg, #2a2826 0%, #1a1816 55%, #111010 100%);
  border:1px solid var(--ivory-10);
  border-left:0;
  border-radius:0 5px 5px 0;
  box-shadow:4px 0 16px rgba(0,0,0,.5), inset 1px 0 0 var(--ivory-06);
  transition:border-color .2s ease, background .2s ease;
}
.expand:hover,.expand:focus-visible{
  border-color:var(--ivory-20);
  background:linear-gradient(180deg, #343131 0%, #232020 55%, #181616 100%);
}
.expand:focus-visible{outline:2px solid var(--candle);outline-offset:3px}

/* the arrow is centred by transform, not by layout, so rotating it in
   landscape keeps it exactly inside the plate */
.expand svg{
  position:absolute;
  left:50%;
  top:50%;
  width:22px;
  height:38px;
  overflow:visible;
  transform:perspective(560px) translate(-50%,-50%);
  transition:transform .42s cubic-bezier(.45,0,.25,1);
}
/* The arrow always points out of the keyboard. When the next tap will put the
   keyboard away, a bar slides in beside it — the usual "collapse to the edge"
   mark — rather than the arrow reversing, which read the wrong way round. */
.expand .bar{
  opacity:0;
  transform:translateX(-5px);
  transition:opacity .3s ease, transform .3s ease;
}
body.keys-open .expand .bar{opacity:1;transform:translateX(0)}

/* ---- landscape: the keys lie down along the bottom ---- */
@media (orientation:landscape) and (max-height:620px){
  .stage{display:block}

  .rack{
    position:fixed;
    left:0; right:0; bottom:0;
    top:auto;
    width:auto;
    height:var(--deck);
    z-index:20;
    transition:height .34s cubic-bezier(.4,0,.2,1);
  }
  .rack{box-shadow:0 -6px 26px rgba(0,0,0,.55)}
  body.keys-open .rack{width:auto;height:var(--deck-x)}
  body.keys-hidden .rack{width:auto;height:0}
  body.rack-dragging .rack{width:auto;height:var(--drag-h);transition:none}

  .wkey{
    top:0;
    height:100%;
    left:calc(var(--i) * var(--kstep) + 2px);
    width:calc(var(--kstep) - 4px);
    border:0;
    border-radius:0 0 3px 3px;
  }
  .bkey{
    top:0;
    right:auto;
    height:62%;
    left:calc(var(--b) * var(--kstep) - var(--kstep) * .31);
    width:calc(var(--kstep) * .62);
    border-radius:0 0 2px 2px;
  }

  .expand{
    left:auto;
    right:26px;
    top:auto;
    bottom:100%;
    margin:0;
    width:94px;
    height:44px;
    border:1px solid var(--ivory-10);
    border-bottom:0;
    border-radius:5px 5px 0 0;
    cursor:ns-resize;
    box-shadow:0 -4px 16px rgba(0,0,0,.5), inset 0 1px 0 var(--ivory-06);
  }
  /* laid on its side the arrow points up out of the deck, and the collapse
     bar lands under it, which is the way the deck goes when it is put away */
  .expand svg{transform:perspective(560px) translate(-50%,-50%) rotate(-90deg)}

  /* the card CSS is declared after this block, so these are scoped to body
     to outrank the plain .panel rule rather than relying on order */
  body .panel{padding-bottom:calc(var(--deck) + 34px);touch-action:auto}
  body.keys-open .panel{padding-bottom:calc(var(--deck-x) + 34px)}

  /* the card scrolls in this layout, so the stop button pins to the viewport
     and rides just above the keys instead of sitting at the card's foot */
  body .playing,body .loading{position:fixed;bottom:calc(var(--deck) + 14px)}
  body.keys-open .playing,body.keys-open .loading{bottom:calc(var(--deck-x) + 14px)}
  body.keys-hidden .playing,body.keys-hidden .loading{bottom:14px}

  /* the deck at full height leaves only a sliver of card, so keep the names */
  body.keys-open .hint,
  body.keys-open .eyebrow,
  body.keys-open .invite,
  body.keys-open .rule,
  body.keys-open .label,
  body.keys-open .when,
  body.keys-open .where,
  body.keys-open .rsvp{display:none}
  body.keys-open .names{
    margin-top:0;
    font-size:clamp(1.5rem,6.6svh,2.6rem);
  }
}

/* ---- a narrow portrait card can't hold everything once the keys grow,
        so it falls back to just the two names ---- */
@media (orientation:portrait) and (max-width:620px){
  body.keys-open .hint,
  body.keys-open .eyebrow,
  body.keys-open .invite,
  body.keys-open .rule,
  body.keys-open .label,
  body.keys-open .when,
  body.keys-open .where,
  body.keys-open .rsvp{display:none}

  body.keys-open .panel{padding-left:0}
  body.keys-open .inner{position:static}   /* so the names sit against the panel */

  /* Wide open there is no room for the card, so the names lie on their side,
     reading top to bottom. Turning the phone brings them upright — and hands
     the keyboard the whole width to be played on. Nudged right of centre to
     stay clear of the tab. */
  body.keys-open .names{
    position:absolute;
    left:calc(50% + 24px);
    top:50%;
    display:flex;
    flex-direction:column-reverse;      /* so it reads Sachin, &, Kesia once turned */
    align-items:center;
    gap:0;
    width:74svh;
    margin:0;
    white-space:nowrap;
    font-size:clamp(1.55rem,5.6svh,2.4rem);
    transform:translate(-50%,-50%) rotate(90deg);
  }
  body.keys-open .amp{margin:0;font-size:.62em}
}

/* ============ the card ============ */
.panel{
  position:relative;
  flex:1 1 auto;
  min-width:0;
  touch-action:none;              /* a finger drawn across the card must not scroll it */
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:clamp(24px,4.6vh,72px) clamp(16px,4.5vw,46px);
}
.inner{position:relative;z-index:1;width:100%;max-width:460px;transform-origin:top center}

/* The canvas covers the viewport and is clipped to the card each frame, so
   it tracks the keyboard as it resizes.

   width/height are spelled out on purpose. A canvas is a replaced element,
   so inset:0 alone does NOT stretch it — it keeps its intrinsic 300x150 and
   the browser then scales the backing store up to fit, which is what pushed
   every mark down and to the right by the device pixel ratio. */
#trail{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:block;
  z-index:6;
  pointer-events:none;
}

.hint{
  font-family:var(--util);
  font-weight:300;
  font-size:.65rem;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--ivory-45);
  margin-bottom:clamp(13px,2.4vh,30px);
  white-space:nowrap;
  transition:opacity .7s ease;
}
.hint.gone{opacity:0}

.eyebrow{
  font-family:var(--util);
  font-weight:300;
  font-size:clamp(.58rem,2.4vw,.68rem);
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--gold-dim);
  padding-left:.28em;
}

.names{
  margin-top:clamp(11px,2.2vh,30px);
  font-family:var(--display);
  font-weight:400;
  font-size:clamp(2.4rem,11.4vw,4.6rem);
  line-height:1;
  color:var(--ivory);
  text-shadow:0 0 46px rgba(244,240,232,.12);
}
.amp{
  display:block;
  font-family:var(--display);
  font-style:italic;
  font-weight:300;
  font-size:.55em;
  color:var(--ivory-72);
  line-height:1;
  margin:clamp(2px,.8vw,10px) 0;
}

.invite{
  margin-top:clamp(13px,2.5vh,28px);
  font-family:var(--display);
  font-style:italic;
  font-size:clamp(.92rem,3.6vw,1.1rem);
  line-height:1.5;
  color:var(--ivory-72);
}

.rule{
  width:48px;
  height:1px;
  border:0;
  background:var(--rule);
  margin:clamp(15px,2.9vh,38px) auto;
}

.label{
  font-family:var(--util);
  font-weight:300;
  font-size:.6rem;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--gold-dim);
  padding-left:.28em;
}
.when{
  margin-top:9px;
  font-family:var(--display);
  font-size:clamp(1.12rem,4.4vw,1.6rem);
  letter-spacing:.01em;
  line-height:1.3;
}
.when-time{
  margin-top:7px;
  font-family:var(--util);
  font-weight:300;
  font-size:clamp(.84rem,3.3vw,.96rem);
  letter-spacing:.08em;
  color:var(--ivory-72);
}

/* ============ where ============ */
.where{
  display:block;
  margin-top:clamp(17px,3.1vh,44px);
  max-width:420px;
  border:1px solid var(--ivory-20);
  border-radius:3px;
  padding:clamp(16px,3vh,24px) clamp(20px,4vw,32px);
  background:rgba(244,240,232,.025);
  color:inherit;
  text-decoration:none;
  -webkit-user-drag:none;
  transition:border-color .22s ease, background .22s ease;
}
.where[href]{cursor:pointer}
.where[href]:hover,.where[href]:focus-visible{
  border-color:rgba(244,240,232,.34);
  background:rgba(244,240,232,.06);
}
.where[href]:focus-visible{outline:2px solid var(--candle);outline-offset:3px}
.pin{
  width:.8em;height:.8em;flex:none;
  fill:none;stroke:var(--brass);stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;
  opacity:.72;
  transition:transform .22s ease;
}
.where[href]:hover .pin{transform:translateY(-1.5px)}
.where-name{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.42em;
  margin-top:8px;
  font-family:var(--display);
  font-weight:400;
  font-size:clamp(1.16rem,4.9vw,1.6rem);
  line-height:1.26;
  color:var(--ivory);
}
.where-lines{
  margin-top:7px;
  font-family:var(--util);
  font-weight:300;
  font-size:clamp(.82rem,3.3vw,.94rem);
  letter-spacing:.04em;
  line-height:1.6;
  color:var(--muted);
}

.todo{
  margin-top:14px;
  font-family:var(--util);
  font-size:.82rem;
  line-height:1.75;
  color:var(--muted);
}
.todo code{font-family:ui-monospace,monospace;color:var(--candle)}

/* ---------------- the envelope that switches the sound on -------------- */
.gate{
  position:fixed;
  inset:0;
  z-index:40;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(26px,5.4vh,52px);
  background:linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 50%, var(--bg-0) 100%);
  cursor:pointer;
  touch-action:none;
}
/* It lifts away rather than simply fading, so the card underneath reads as
   having been uncovered instead of having been there all along. */
.gate.gone{
  pointer-events:none;
  animation:gate-exit .9s cubic-bezier(.4,0,.6,1) forwards;
}

/* ---- the envelope ---- */
/* Boxes and clip-paths rather than the one SVG this used to be: the flap
   has to turn on a real 3D axis, and a transformed group inside an SVG
   cannot take the perspective from its parent.

   Four flaps, not two. A top triangle and a faint inner seam on a charcoal
   rectangle read as an X on a dark phone; four faces with different values
   read as folded paper. The meeting point is hardcoded (not a custom
   property) so clip-path cannot miss it on older Samsung Internet. */
.env{
  position:relative;
  width:clamp(220px,70vw,320px);
  aspect-ratio:300/210;
  perspective:900px;
  filter:drop-shadow(0 18px 40px rgba(0,0,0,.72));
}

.env-body{
  position:absolute;
  inset:0;
  border-radius:4px;
  background:#2a2726;
  box-shadow:
    0 0 0 1px rgba(244,240,232,.38),
    inset 0 1px 0 rgba(244,240,232,.14);
}

.env-l,.env-r,.env-b{
  position:absolute;
  inset:0;
  pointer-events:none;
}
.env-l{
  z-index:2;
  background:linear-gradient(125deg, #7a746f 0%, #5a5551 100%);
  clip-path:polygon(0 0, 50% 52%, 0 100%);
  -webkit-clip-path:polygon(0 0, 50% 52%, 0 100%);
}
.env-r{
  z-index:2;
  background:linear-gradient(235deg, #4e4a47 0%, #353230 100%);
  clip-path:polygon(100% 0, 50% 52%, 100% 100%);
  -webkit-clip-path:polygon(100% 0, 50% 52%, 100% 100%);
}
.env-b{
  z-index:3;
  background:linear-gradient(to top, #3f3b38 0%, #615c58 100%);
  clip-path:polygon(0 100%, 50% 52%, 100% 100%);
  -webkit-clip-path:polygon(0 100%, 50% 52%, 100% 100%);
}

.env-card{
  position:absolute;
  left:4.6%;right:4.6%;bottom:5%;
  height:85%;
  /* above the flap, not below it: once the flap has turned back the card
     has to come up in front of it, the way it would out of a real one.
     It is invisible until it moves, so this costs nothing at rest. */
  z-index:15;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.26em;
  overflow:hidden;
  border:1px solid var(--ivory-20);
  border-radius:2px;
  background:linear-gradient(180deg, #4a4644 0%, #2c2a29 60%, #1a1918 100%);
  box-shadow:0 -8px 28px rgba(0,0,0,.5);
  opacity:0;
  font-family:var(--display);
  font-size:clamp(15px,4.4vw,25px);
  color:var(--ivory-72);
  white-space:nowrap;
}
.env-card .amp-sm{font-style:italic;color:var(--brass)}

.env-flap{
  position:absolute;
  top:0;left:0;right:0;
  height:52%;
  z-index:10;
  background:
    linear-gradient(to bottom, rgba(244,240,232,.2), transparent 42%),
    linear-gradient(165deg, #9a948e 0%, #6e6964 100%);
  clip-path:polygon(0 0, 50% 100%, 100% 0);
  -webkit-clip-path:polygon(0 0, 50% 100%, 100% 0);
  transform-style:preserve-3d;
  transform-origin:top center;
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
}

/* Centred by negative margins, not by a transform — the transform belongs
   to the animation that breaks the seal. Percentage margins resolve against
   the envelope's width in both axes, and the seal is square, so half its
   width is also half its height. */
.seal{
  position:absolute;
  top:52%;left:50%;
  width:16.7%;
  aspect-ratio:1;
  margin:-8.35% 0 0 -8.35%;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  border:1px solid rgba(244,240,232,.28);
  background:radial-gradient(circle at 38% 32%, #8B3A2A, #5A1F14);
  box-shadow:0 4px 14px rgba(0,0,0,.45), inset 0 1px 0 rgba(244,240,232,.18);
  font-family:var(--display);
  font-size:clamp(17px,4.6vw,26px);
  line-height:1;
  color:rgba(244,240,232,.88);
  pointer-events:none;          /* the whole gate is the tap target */
}
.gate:not(.opening) .seal{animation:seal-breathe 2.6s ease-in-out infinite}

.gate.opening .env-flap{animation:flap-open 1.1s cubic-bezier(.4,0,.2,1) forwards}
.gate.opening .env-card{animation:card-emerge 1.4s cubic-bezier(.22,1,.36,1) .5s both}
.gate.opening .seal    {animation:seal-break .42s cubic-bezier(.4,0,1,1) forwards}

@keyframes flap-open   {to{transform:rotateX(-180deg)}}
@keyframes card-emerge{
  0%  {transform:translateY(0);     opacity:0}
  12% {                             opacity:1}
  100%{transform:translateY(-108%); opacity:1}
}
@keyframes gate-exit  {to{opacity:0;transform:scale(1.05)}}
@keyframes seal-break {to{opacity:0;transform:scale(.84) rotate(-9deg)}}
@keyframes seal-breathe{
  0%,100%{box-shadow:0 0 0 0 rgba(244,240,232,0), 0 4px 14px rgba(0,0,0,.45), inset 0 1px 0 rgba(244,240,232,.18)}
  50%    {box-shadow:0 0 18px 5px rgba(244,240,232,.14), 0 4px 14px rgba(0,0,0,.45), inset 0 1px 0 rgba(244,240,232,.18)}
}

.gate-hint{
  font-family:var(--util);
  font-weight:300;
  font-size:.66rem;
  letter-spacing:.32em;
  text-transform:uppercase;
  color:var(--muted);
  padding-left:.32em;
  animation:breathe 2.6s ease-in-out infinite;
}
.gate.opening .gate-hint{opacity:0;transition:opacity .3s ease;animation:none}
@keyframes breathe{
  0%,100%{opacity:.55}
  50%    {opacity:1}
}

/* The card assembles itself as the envelope lifts away. The fill is
   `backwards`, not `both`, on purpose: each line gives its transform back
   the moment it lands, so none of this is left fighting the rotated-names
   layout that portrait uses once the keyboard is opened wide. */
@keyframes fade-up{
  from{opacity:0;transform:translateY(12px)}
  to  {opacity:1;transform:translateY(0)}
}
body.revealed .inner > *{animation:fade-up .55s ease-out backwards}
body.revealed .hint          {animation-delay:.05s}
body.revealed .eyebrow       {animation-delay:.12s}
body.revealed .names         {animation-delay:.2s}
body.revealed .invite        {animation-delay:.3s}
body.revealed .rule          {animation-delay:.38s}
body.revealed .inner > .label{animation-delay:.44s}
body.revealed .when          {animation-delay:.48s}
body.revealed .where         {animation-delay:.52s}
body.revealed .rsvp          {animation-delay:.58s}

/* Sits where the stop button will later sit, and says the piano is still
   arriving — so a tap that sounds thin is explained rather than puzzling. */
.loading{
  position:absolute;
  left:50%;
  bottom:clamp(14px,3vh,32px);
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  padding:9px 18px 10px;
  border:1px solid var(--rule);
  border-radius:999px;
  background:rgba(15,14,14,.82);
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  opacity:0;
  visibility:hidden;
  z-index:5;
  pointer-events:none;
  transition:opacity .45s ease;
}
body.loading-on .loading{opacity:1;visibility:visible}
body.playing-on .loading{display:none}   /* the two share a spot; music wins */

.loading-label{
  font-family:var(--util);
  font-weight:300;
  white-space:nowrap;
  font-size:.6rem;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--muted);
}
.loading-track{
  position:relative;
  width:96px;
  height:2px;
  border-radius:2px;
  background:var(--ivory-10);
  overflow:hidden;
}
.loading-track i{
  position:absolute;
  inset:0;
  border-radius:2px;
  background-color:var(--brass);
  background-image:linear-gradient(90deg, var(--brass), var(--candle));
  transform:scaleX(0);
  transform-origin:left center;
  transition:transform .25s ease-out;
}

/* Appears once the music has been left running on its own, and stops it. */
.playing{
  position:absolute;
  left:50%;
  bottom:clamp(14px,3vh,32px);
  transform:translateX(-50%) translateY(6px);
  display:flex;
  align-items:center;
  gap:11px;
  padding:9px 16px 9px 13px;
  border:1px solid var(--rule);
  border-radius:999px;
  background:rgba(15,14,14,.82);
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  font-family:var(--util);
  font-weight:300;
  font-size:.64rem;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--linen);
  cursor:pointer;
  opacity:0;
  visibility:hidden;
  z-index:5;
  transition:opacity .6s ease, transform .6s ease, border-color .2s ease, background .2s ease;
}
body.playing-on .playing{
  opacity:1;
  visibility:visible;
  transform:translateX(-50%) translateY(0);
}
.playing:hover,.playing:focus-visible{
  border-color:rgba(244,240,232,.28);
  background:rgba(37,35,35,.92);
}
.playing:focus-visible{outline:2px solid var(--candle);outline-offset:3px}

.eq{display:flex;align-items:flex-end;gap:3px;height:15px}
.eq i{
  width:2.5px;
  height:100%;
  border-radius:2px;
  background-color:var(--brass);
  background-image:linear-gradient(var(--candle), var(--brass));
  transform-origin:bottom center;
  transform:scaleY(.3);
}
/* the bars only move while the music is actually playing; a hidden element
   still runs its animation otherwise, for nothing */
body.playing-on .eq i{animation:eq 1.05s ease-in-out infinite}
body.playing-on .eq i:nth-child(2){animation-duration:.78s;animation-delay:-.2s}
body.playing-on .eq i:nth-child(3){animation-duration:1.24s;animation-delay:-.5s}
body.playing-on .eq i:nth-child(4){animation-duration:.9s;animation-delay:-.34s}
body.playing-on .eq i:nth-child(5){animation-duration:1.4s;animation-delay:-.72s}
@keyframes eq{
  0%,100%{transform:scaleY(.28)}
  50%    {transform:scaleY(1)}
}

.rsvp{
  margin-top:clamp(15px,2.8vh,34px);
  font-family:var(--util);
  font-size:.72rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  line-height:2;
  color:var(--linen);
}
.rsvp a{color:var(--linen);text-decoration:none;border-bottom:1px solid var(--rule)}

@media (prefers-reduced-motion:reduce){
  .hint,.where,.pin,.rack,.expand,.expand svg,.expand .bar,.loading{transition:none}
  .gate-hint,.seal{animation:none}
  /* the envelope still opens — it just does it at once */
  .gate.opening .env-flap,
  .gate.opening .env-card,
  .gate.opening .seal,
  .gate.gone{animation-duration:.01s}
  body.revealed .inner > *{animation:none}
  .playing{transition:none}
  body.playing-on .eq i{animation:none;transform:scaleY(.6)}
}
</style>
</head>
<body>

<span class="probe" id="probeA" aria-hidden="true"></span>
<span class="probe" id="probeB" aria-hidden="true"></span>

<!-- The sound gate. Browsers only wake audio on a real touch, so rather than
     that being an invisible technicality, the first tap opens an envelope. -->
<div class="gate" id="gate">
  <div class="env">
    <div class="env-body"></div>
    <div class="env-l" aria-hidden="true"></div>
    <div class="env-r" aria-hidden="true"></div>
    <div class="env-b" aria-hidden="true"></div>
    <div class="env-card">Sachin<span class="amp-sm">&amp;</span>Kesia</div>
    <div class="env-flap"></div>
    <div class="seal" aria-hidden="true">S</div>
  </div>

  <p class="gate-hint">Tap to open</p>
</div>

<canvas id="trail" aria-hidden="true"></canvas>

<div class="stage">
  <div class="rack" id="rack">
    <div class="board" id="board" role="group" aria-label="Playable piano keyboard">
      <canvas id="keys" aria-hidden="true"></canvas>
      <button class="expand" id="expand" type="button"
              aria-expanded="false" aria-label="Resize the keyboard"
              title="Tap to resize, or drag to hide">
        <svg viewBox="0 0 22 38" aria-hidden="true">
          <defs>
            <linearGradient id="tabGold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0"   stop-color="#e8d28a"/>
              <stop offset=".45" stop-color="#c9a84c"/>
              <stop offset="1"   stop-color="#a5873a"/>
            </linearGradient>
          </defs>
          <path class="tab" d="M1.5 3.5 L14.5 19 L1.5 34.5 Z"
                fill="url(#tabGold)" stroke="url(#tabGold)" stroke-width="3"
                stroke-linejoin="round"/>
          <rect class="bar" x="17.2" y="3" width="3.6" height="32" rx="1.8"
                fill="url(#tabGold)"/>
        </svg>
      </button>
    </div>
  </div>

  <main class="panel" id="panel">
    <div class="inner">
      <p class="hint" id="hint">♪ &nbsp;Tap the keys</p>

      <p class="eyebrow" id="eyebrow"></p>

      <h1 class="names">
        <span id="groom"></span>
        <span class="amp">&amp;</span>
        <span id="bride"></span>
      </h1>

      <p class="invite" id="invite"></p>

      <hr class="rule">

      <p class="label">When</p>
      <p class="when" id="when"></p>
      <p class="when-time" id="whenTime"></p>

      <a class="where" id="where" draggable="false">
        <p class="label">Where</p>
        <div id="whereBody"></div>
      </a>

      <p class="rsvp" id="rsvp"></p>
    </div>
    <div class="loading" id="loading" role="status" aria-label="Loading the piano">
      <span class="loading-label">Tuning the piano</span>
      <span class="loading-track"><i id="loadingBar"></i></span>
    </div>
    <button class="playing" id="playing" type="button" aria-label="Stop the music">
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      Stop
    </button>
  </main>
</div>

<script>
/* =====================================================================
   EDIT EVERYTHING HERE.
   (Except the og: meta tags at the top — WhatsApp reads those directly.)
   ===================================================================== */
const DINNER = {
  eyebrow:    "The Wedding Eve",
  groom:      "Sachin",
  bride:      "Kesia",
  invite:     ["would love your company", "at Madhuram Veppu"],

  when:       ["Sunday", "13 September 2026"],
  time:       "7:00 pm",             // leave "" and no time is shown at all

  // --- venue ---
  venueName:  "Carmel Hall",
  venueLines: ["Varapuzha, Kerala"],
  mapsUrl:    "https://maps.app.goo.gl/uv8odtBzHEgGqZ8F8",

  rsvp:       "",                    // e.g. "+91 98470 00000"

  octaves:    2                      // how much keyboard to show
};

/* ------------------------------ content ------------------------------ */
const $ = id => document.getElementById(id);
const lines = v => [].concat(v).join("<br>");

$("eyebrow").textContent = DINNER.eyebrow;
$("groom").textContent = DINNER.groom;
$("bride").textContent = DINNER.bride;
$("invite").innerHTML = lines(DINNER.invite);
$("when").innerHTML = lines(DINNER.when);

// no time given, no line for it — not an empty one holding its own margin
if (DINNER.time) $("whenTime").textContent = DINNER.time;
else $("whenTime").remove();

if (DINNER.rsvp) {
  $("rsvp").innerHTML = 'RSVP <a href="tel:' + DINNER.rsvp.replace(/\s/g, "") + '">' +
                        DINNER.rsvp + "</a>";
}

const PIN = '<svg class="pin" viewBox="0 0 24 24" aria-hidden="true">' +
  '<path d="M12 21.5s6.75-6.1 6.75-11.25a6.75 6.75 0 1 0-13.5 0C5.25 15.4 12 21.5 12 21.5z"/>' +
  '<circle cx="12" cy="10" r="2.6"/></svg>';

const wb = $("whereBody");
if (DINNER.venueName) {
  wb.innerHTML =
    '<p class="where-name">' + DINNER.venueName + (DINNER.mapsUrl ? PIN : "") + "</p>" +
    (DINNER.venueLines.length
      ? '<p class="where-lines">' + lines(DINNER.venueLines) + "</p>"
      : "");
  // the box itself is the link, so a tap anywhere in it opens the map
  if (DINNER.mapsUrl) {
    const box = $("where");
    box.href = DINNER.mapsUrl;
    box.target = "_blank";
    box.rel = "noopener";
    box.setAttribute("aria-label", "Open " + DINNER.venueName + " in Maps");
  }
} else {
  wb.innerHTML = '<p class="todo">Set <code>venueName</code>, <code>venueLines</code> ' +
                 'and <code>mapsUrl</code> in the DINNER block to fill this in.</p>';
}

/* ------------------------------ keyboard ----------------------------- */
const WHITE = [0, 2, 4, 5, 7, 9, 11];              // C D E F G A B
const BLACK = { 0: 1, 1: 3, 3: 6, 4: 8, 5: 10 };   // white index -> black semitone
const NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

const board = $("board");
const octaves = Math.max(1, DINNER.octaves);
const whiteCount = octaves * 7;
board.style.setProperty("--n", whiteCount);
const label = m => NAMES[m % 12] + (Math.floor(m / 12) - 1);

for (let o = 0; o < octaves; o++) {
  for (let i = 0; i < 7; i++) {
    const idx = o * 7 + i;
    const midi = 60 + o * 12 + WHITE[i];           // starts at middle C

    const w = document.createElement("button");
    w.className = "wkey";
    w.type = "button";
    w.dataset.midi = midi;
    w.setAttribute("aria-label", label(midi));
    w.style.setProperty("--i", idx);
    board.appendChild(w);

    if (i in BLACK && idx < whiteCount - 1) {
      const bm = 60 + o * 12 + BLACK[i];
      const b = document.createElement("button");
      b.className = "bkey";
      b.type = "button";
      b.dataset.midi = bm;
      b.setAttribute("aria-label", label(bm));
      b.style.setProperty("--b", idx + 1);
      board.appendChild(b);
    }
  }
}

/* ---------------------- painting the keys ---------------------------- */
/* Geometry comes straight from the buttons' own boxes, so the picture can
   never drift out of line with what a tap actually hits. */
const keysCv = $("keys");
const kctx = keysCv.getContext("2d");
const wkeys = [].slice.call(board.querySelectorAll(".wkey"));
const bkeys = [].slice.call(board.querySelectorAll(".bkey"));

const IVORY = "#f4f0e8", IVORY_LIT = "#cdc9bf";
const EBONY = "#0a0909", EBONY_LIT = "#2b2827";

function slab(x, y, w, h, r) {
  if (w <= 0 || h <= 0) return;
  if (kctx.roundRect) {
    kctx.beginPath();
    kctx.roundRect(x, y, w, h, r);
    kctx.fill();
  } else {
    kctx.fillRect(x, y, w, h);
  }
}

function paintKeys() {
  const br = board.getBoundingClientRect();
  if (br.width < 1 || br.height < 1) return;

  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const bw = Math.round(br.width * dpr), bh = Math.round(br.height * dpr);
  if (keysCv.width !== bw || keysCv.height !== bh) {
    keysCv.width = bw; keysCv.height = bh;
  }
  kctx.setTransform(bw / br.width, 0, 0, bh / br.height, 0, 0);
  kctx.clearRect(0, 0, br.width, br.height);

  const deck = isDeck();
  const wr = deck ? [0, 0, 3, 3] : [0, 3, 3, 0];
  const br_ = deck ? [0, 0, 2, 2] : [0, 2, 2, 0];

  for (const el of wkeys) {
    const r = el.getBoundingClientRect();
    kctx.fillStyle = el.classList.contains("on") ? IVORY_LIT : IVORY;
    slab(r.left - br.left, r.top - br.top, r.width, r.height, wr);
  }
  for (const el of bkeys) {
    const r = el.getBoundingClientRect();
    kctx.fillStyle = el.classList.contains("on") ? EBONY_LIT : EBONY;
    slab(r.left - br.left, r.top - br.top, r.width, r.height, br_);
  }
}

paintKeys();
// fires every frame while the rack transitions, so the picture keeps up
if (typeof ResizeObserver === "function") new ResizeObserver(paintKeys).observe(board);
else addEventListener("resize", paintKeys);
addEventListener("resize", paintKeys);
addEventListener("orientationchange", () => setTimeout(paintKeys, 120));

/* -------------------------------- sound ------------------------------ */
/* Real piano if the samples are there, synthesis if they aren't. The page
   works either way: nothing waits on the network, and the synth keeps
   playing until the buffers have decoded.

   Samples: Salamander Grand Piano v3 by Alexander Holm (Yamaha C5),
   CC BY 3.0 — https://creativecommons.org/licenses/by/3.0/
   Trimmed to five seconds each for the web. Keep piano/CREDITS.txt
   alongside them; the licence asks for attribution. */
const PIANO_DIR = "piano/";
const PIANO_MAP = { 48: "C3", 51: "Ds3", 54: "Fs3", 57: "A3",
                    60: "C4", 63: "Ds4", 66: "Fs4", 69: "A4",
                    72: "C5", 75: "Ds5", 78: "Fs5", 81: "A5",
                    84: "C6", 87: "Ds6", 90: "Fs6", 93: "A6" };
const PIANO_KEYS = Object.keys(PIANO_MAP).map(Number);

const PIANO_BYTES = 488316;            // the set's real size, for the progress bar

let ctx = null, piano = null, pianoTries = 0, pianoLoading = false;
const freq = m => 440 * Math.pow(2, (m - 69) / 12);

function audio() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === "suspended") ctx.resume();
  loadPiano();                          // a no-op once it has them
  return ctx;
}

/* Reads each file in chunks so the bar moves as the bytes arrive, rather
   than jumping sixteen times as whole files land. */
function pull(url, onBytes) {
  return fetch(url).then(r => {
    if (!r.ok) return Promise.reject(r.status);
    if (!r.body || !r.body.getReader) return r.arrayBuffer();   // older browsers
    const reader = r.body.getReader();
    const parts = [];
    let n = 0;
    const step = () => reader.read().then(({ done, value }) => {
      if (done) {
        const all = new Uint8Array(n);
        let at = 0;
        for (const part of parts) { all.set(part, at); at += part.length; }
        return all.buffer;
      }
      parts.push(value); n += value.length;
      onBytes(value.length);
      return step();
    });
    return step();
  });
}

function loadPiano() {
  if (piano || pianoLoading || pianoTries >= 2) return;
  pianoLoading = true;
  pianoTries++;

  const got = {};
  let left = PIANO_KEYS.length, ok = true, bytes = 0;

  showLoading();
  const tick = n => { bytes += n; setProgress(bytes / PIANO_BYTES); };

  for (const midi of PIANO_KEYS) {
    pull(PIANO_DIR + PIANO_MAP[midi] + ".mp3", tick)
      .then(a => ctx.decodeAudioData(a))
      .then(buf => { got[midi] = buf; })
      .catch(() => { ok = false; })          // no samples: stay on the synth
      .then(() => {
        if (--left) return;
        pianoLoading = false;
        if (ok) piano = got;
        doneLoading(ok);
      });
  }
}

/* ---- the little bar at the foot of the card ---- */
const loadPill = $("loading"), loadBar = $("loadingBar");

function showLoading() {
  setProgress(0);
  document.body.classList.add("loading-on");
}

function setProgress(f) {
  loadBar.style.transform = "scaleX(" + Math.max(0, Math.min(1, f)).toFixed(4) + ")";
}

function doneLoading(ok) {
  setProgress(1);                       // land on full even if the total drifted
  setTimeout(() => {
    document.body.classList.remove("loading-on");
    if (ok) $("hint").innerHTML = "\u266A &nbsp;Tap the keys";
  }, ok ? 550 : 0);
}

// start before anyone taps, so the piano is usually ready by the time it matters
audio();

/* ------------------- the envelope that opens the sound ---------------- */
/* The browser will not make a sound until a real touch says so. This turns
   that requirement into the first thing the guest does, and confirms the
   sound is on by playing a chord as the flap lifts. */
const gate = $("gate");
let opened = false;

gate.addEventListener("pointerdown", e => {
  if (opened) return;
  opened = true;
  e.preventDefault();
  e.stopPropagation();

  audio();                             // unlocked here, inside the tap itself
  gate.classList.add("opening");

  // a quiet chord so the guest hears that sound is now on
  [60, 64, 67, 72].forEach((m, i) => setTimeout(() => voice(m, .055, 2.4), 120 + i * 90));

  // long enough for the flap to turn and the card to clear the envelope —
  // but there is nothing to wait for if the opening is not being animated
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(() => {
    gate.classList.add("gone");
    document.body.classList.add("revealed");
  }, still ? 260 : 1900);
  setTimeout(() => gate.remove(), still ? 500 : 2900);
});

// nearest sampled note, then pitch-shifted to the one we want
function sampled(midi, level, len, when) {
  let near = PIANO_KEYS[0];
  for (const k of PIANO_KEYS) {
    if (Math.abs(k - midi) < Math.abs(near - midi)) near = k;
  }
  const t = when || ctx.currentTime;
  const src = ctx.createBufferSource();
  src.buffer = piano[near];
  src.playbackRate.value = Math.pow(2, (midi - near) / 12);

  const g = ctx.createGain();
  g.gain.setValueAtTime(level, t);
  g.gain.setValueAtTime(level, t + len * 0.55);
  g.gain.exponentialRampToValueAtTime(0.0001, t + len);   // damp the tail
  src.connect(g); g.connect(ctx.destination);
  src.start(t); src.stop(t + len + 0.1);
}

function strike(midi) {
  audio();
  if (piano) return sampled(midi, 1.5, 3.4);

  const t = ctx.currentTime;
  const f = freq(midi);
  const out = ctx.createGain();
  out.connect(ctx.destination);

  out.gain.setValueAtTime(0.0001, t);
  out.gain.exponentialRampToValueAtTime(0.32, t + 0.006);
  out.gain.exponentialRampToValueAtTime(0.09, t + 0.16);
  out.gain.exponentialRampToValueAtTime(0.0001, t + 2.0);

  // fundamental plus partials, each quieter and shorter as it climbs
  [[1, 0.62, "triangle"], [2, 0.22, "sine"], [3, 0.11, "sine"],
   [4, 0.055, "sine"], [6, 0.022, "sine"]].forEach(([h, amp, type]) => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.value = f * h;
    osc.detune.value = (h - 1) * 3;                // slight inharmonicity
    g.gain.setValueAtTime(amp, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.0 / Math.sqrt(h));
    osc.connect(g); g.connect(out);
    osc.start(t); osc.stop(t + 2.1);
  });
}

/* ------------------- the chord run under the drawing ----------------- */
/* Taken from the reference MIDI rather than from listening: an eighth-note
   ostinato at 120bpm — a long low root on the downbeat, then the root and
   the fifth below it trading places, with the third or the octave dropped in
   now and then for colour. The notes ring on well past the next one, which
   is what makes it sound denser than the sixteen notes a bar it really is. */
const CHORDS = [
  { name: "C",    root: 0,  third: 4, dim: false },
  { name: "F",    root: 5,  third: 4, dim: false },
  { name: "Bb",   root: 10, third: 4, dim: false },
  { name: "Bdim", root: 11, third: 3, dim: true  },
  { name: "Em",   root: 4,  third: 3, dim: false },
  { name: "Am",   root: 9,  third: 3, dim: false },
  { name: "Dm",   root: 2,  third: 3, dim: false },
  { name: "G",    root: 7,  third: 4, dim: false }
];
const BEAT = 250;                      // ms per eighth at 120bpm
const TRAVEL = 90;                     // px of finger travel per chord change

let chordAt = 0;

function voice(midi, peak, len, when) {
  audio();
  // the samples sit at about a quarter of full scale, so they need lifting
  // to sit where the synth's peak levels were
  if (piano) return sampled(midi, peak * 5.2, len, when);

  const t = when || ctx.currentTime;
  const f = freq(midi);
  const out = ctx.createGain();
  out.connect(ctx.destination);
  out.gain.setValueAtTime(0.0001, t);
  out.gain.exponentialRampToValueAtTime(peak, t + 0.016);
  out.gain.exponentialRampToValueAtTime(peak * 0.34, t + 0.22);
  out.gain.exponentialRampToValueAtTime(0.0001, t + len);

  [[1, .74], [2, .26], [3, .1], [4.2, .04]].forEach(([h, amp]) => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = f * h;
    g.gain.setValueAtTime(amp, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len / Math.sqrt(h));
    osc.connect(g); g.connect(out);
    osc.start(t); osc.stop(t + len + 0.1);
  });
}

/* ----------------------- playing a MIDI file ------------------------- */
/* Drop a .mid beside the page and one finger held on the card plays it.
   Two fingers fall back to the chord pattern above. If the file isn't
   there, the pattern is all you get and nothing breaks. */
const MIDI_FILE = "song.mid";
const LOOP_GAP = 2.4;                  // seconds of quiet before it comes round again

let song = null, songAt = 0, songClock = 0, songTimer = 0;

// enough of the format to read note on/off and tempo out of a type 0 or 1 file
function readMidi(buf) {
  const v = new DataView(buf), b = new Uint8Array(buf);
  let p = 0;
  const u32 = () => { const n = v.getUint32(p); p += 4; return n; };
  const u16 = () => { const n = v.getUint16(p); p += 2; return n; };
  const vlq = () => { let n = 0, c; do { c = b[p++]; n = (n << 7) | (c & 0x7f); } while (c & 0x80); return n; };

  if (v.getUint32(0) !== 0x4d546864) return null;      // "MThd"
  p = 4;
  const head = u32(); p += 2;
  const tracks = u16(), division = u16();
  p = 8 + head;

  const events = [];                                   // ticks, then to seconds
  const tempos = [[0, 500000]];

  for (let t = 0; t < tracks && p + 8 <= b.length; t++) {
    if (v.getUint32(p) !== 0x4d54726b) break;           // "MTrk"
    p += 4;
    const len = u32();
    const end = p + len;                                // data starts at p
    let tick = 0, status = 0;
    const held = {};
    while (p < end) {
      tick += vlq();
      let s = b[p];
      if (s & 0x80) { status = s; p++; } else { s = status; }
      const kind = status & 0xf0;

      if (status === 0xff) {
        const meta = b[p++], len = vlq();
        if (meta === 0x51) tempos.push([tick, (b[p] << 16) | (b[p + 1] << 8) | b[p + 2]]);
        p += len;
      } else if (status === 0xf0 || status === 0xf7) {
        p += vlq();
      } else if (kind === 0xc0 || kind === 0xd0) {
        p += 1;
      } else {
        const n = b[p], vel = b[p + 1]; p += 2;
        if (kind === 0x90 && vel > 0) {
          (held[n] = held[n] || []).push([tick, vel]);
        } else if (kind === 0x80 || kind === 0x90) {
          const q = held[n];
          if (q && q.length) {
            const [start, vv] = q.shift();
            events.push({ tick: start, dur: tick - start, midi: n, vel: vv });
          }
        }
      }
    }
    p = end;                            // resync, whatever the track left behind
  }
  if (!events.length) return null;

  // walk the tempo map so a file with tempo changes still lines up
  tempos.sort((a, b2) => a[0] - b2[0]);
  const at = tk => {
    let sec = 0, prev = 0, us = tempos[0][1];
    for (const [tt, uu] of tempos) {
      if (tt >= tk) break;
      sec += (tt - prev) * us / 1e6 / division;
      prev = tt; us = uu;
    }
    return sec + (tk - prev) * us / 1e6 / division;
  };

  events.sort((a, b2) => a.tick - b2.tick || a.midi - b2.midi);

  // exports often carry the same part on two tracks (one per instrument);
  // sounding both just doubles every note, so keep one of each
  const once = [];
  for (const e of events) {
    const prev = once[once.length - 1];
    if (prev && prev.tick === e.tick && prev.midi === e.midi) continue;
    once.push(e);
  }

  const zero = at(once[0].tick);                       // ignore any lead-in
  return once.map(e => ({
    t: at(e.tick) - zero,
    d: at(e.tick + e.dur) - at(e.tick),
    midi: e.midi,
    vel: e.vel
  }));
}

fetch(MIDI_FILE)
  .then(r => r.ok ? r.arrayBuffer() : Promise.reject(r.status))
  .then(a => { song = readMidi(a); })
  .catch(() => { song = null; });                      // no file: use the pattern

function songBeat() {
  const ahead = ctx.currentTime + 0.3;                 // schedule a little early
  while (songAt < song.length && songClock + song[songAt].t < ahead) {
    const n = song[songAt++];
    const level = 0.06 + (n.vel / 127) * 0.5;
    voice(n.midi, level, Math.max(1, Math.min(3, n.d + 1.2)), songClock + n.t);
  }
  if (songAt >= song.length) {
    // the last notes are scheduled ahead, so the gap is measured from where
    // the piece actually ends rather than from this moment
    const tail = songClock + song[song.length - 1].t + LOOP_GAP;
    songAt = 0;
    songClock = Math.max(ctx.currentTime, tail);
  }
  songTimer = setTimeout(songBeat, 70);
}

function startSong() {
  audio();
  if (songAt >= song.length) songAt = 0;
  songClock = ctx.currentTime + 0.05 - song[songAt].t;  // carry on where it left off
  clearTimeout(songTimer);
  songBeat();
}

function stopSong() {
  clearTimeout(songTimer);
  songTimer = 0;
}

/* Hold the card for five seconds and the music is left running when the
   finger comes off — a second later the bars appear to say so. Two fingers
   put it back down, keeping its place in the piece. */
const LATCH = 5000;                    // ms of holding before it keeps going

let latched = false, heldFrom = 0, showTimer = 0, driftTimer = 0;

function showPlaying() {
  document.body.classList.add("playing-on");
  drift();
}

/* the button only exists while the music is playing on its own */
const stopBtn = $("playing");
stopBtn.addEventListener("pointerdown", e => e.stopPropagation());
stopBtn.addEventListener("click", e => {
  e.stopPropagation();
  stopSong();
  unlatch();
});

function unlatch() {
  latched = false;
  clearTimeout(showTimer);
  clearTimeout(driftTimer);
  showTimer = driftTimer = 0;
  document.body.classList.remove("playing-on");
}

// notes wandering up the card while it plays by itself
function drift() {
  const card = panel.getBoundingClientRect();
  notes.push({
    x: card.left - ox + 40 + Math.random() * Math.max(40, card.width - 80),
    y: card.bottom - oy - 24,
    t: performance.now(),
    life: 2600 + Math.random() * 1000,
    size: 18 + Math.random() * 12,
    rise: card.height * 0.55,
    sway: 8 + Math.random() * 11,
    phase: Math.random() * 6.28,
    tilt: (Math.random() - .5) * .5,
    spin: (Math.random() - .5) * .6,
    g: GLYPHS[(Math.random() * GLYPHS.length) | 0]
  });
  if (notes.length > 40) notes.shift();
  if (!loop) loop = requestAnimationFrame(frame);
  driftTimer = setTimeout(drift, 620 + Math.random() * 620);
}

/* The run keeps going for as long as the finger is down, whether or not it
   is moving. Holding still repeats the bar; travelling turns the chord over
   on the next beat, so a change always lands in time. */
let pulse = 0, beatAt = 0, holdY = 0, travelled = 0, queued = -1;

function octaveShift() {
  const box = panel.getBoundingClientRect();
  const up = 1 - Math.min(1, Math.max(0, (holdY - box.top) / (box.height || 1)));
  return up > .55 ? 12 : 0;            // higher up the card plays an octave up
}

function beat() {
  if (!inking) { pulse = 0; return; }

  let downbeat = beatAt === 0;
  if (queued >= 0) {                   // a queued change restarts the bar
    chordAt = queued;
    queued = -1;
    beatAt = 0;
    downbeat = true;
  }

  const c = CHORDS[chordAt];
  const up = 60 + c.root + octaveShift();   // the root in the middle register
  const fifth = up - (c.dim ? 6 : 5);       // the fifth, sitting below it

  if (downbeat) {
    voice(up - 12, .055, 2.2);         // long low root under the bar
    voice(up, .062, 1.3);
  } else if (beatAt === 2) {
    const r = Math.random();
    if (r < .22)      voice(up + c.third, .058, 1.5);   // the third, as colour
    else if (r < .34) { voice(up, .05, 1.2); voice(up + 12, .03, .8); }
    else              voice(up, .06, 1.2);
  } else {
    voice(fifth, .07, 1.2);
  }

  beatAt = (beatAt + 1) % 4;
  pulse = setTimeout(beat, BEAT);
}

function startRun(vy) {
  holdY = vy;
  travelled = 0;
  chordAt = 0;                         // every stroke opens on C
  queued = -1;
  beatAt = 0;
  clearTimeout(pulse);
  beat();
}

function stopRun() {
  clearTimeout(pulse);
  pulse = 0;
}

/* ------------------------------ interaction -------------------------- *//* ------------------------------ interaction -------------------------- */
const hint = $("hint");
let hinted = false;

let lastHit = { el: null, t: 0 };

function press(el) {
  if (!el || !el.dataset.midi) return;
  const now = performance.now();
  if (el === lastHit.el && now - lastHit.t < 70) return;
  lastHit = { el: el, t: now };
  strike(+el.dataset.midi);
  el.classList.add("on");
  paintKeys();
  setTimeout(() => { el.classList.remove("on"); paintKeys(); }, 160);
  if (!hinted) { hinted = true; hint.classList.add("gone"); }
}

let sliding = false, last = null;

board.addEventListener("pointerdown", e => {
  const k = e.target.closest(".wkey,.bkey");
  if (!k) return;
  e.preventDefault();                   // no compatibility mouse events after this
  sliding = true; last = k;
  press(k);
});

board.addEventListener("pointermove", e => {
  if (!sliding) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const key = el && el.closest ? el.closest(".wkey,.bkey") : null;
  if (key && key !== last) { last = key; press(key); }
});

const stop = () => { sliding = false; last = null; };
window.addEventListener("pointerup", stop);
window.addEventListener("pointercancel", stop);

// physical keyboard, home row = white keys
const ROW = "asdfghjkl;'";
window.addEventListener("keydown", e => {
  if (e.repeat || e.metaKey || e.ctrlKey) return;
  const i = ROW.indexOf(e.key.toLowerCase());
  if (i < 0) return;
  const key = board.querySelectorAll(".wkey")[i];
  if (key) { e.preventDefault(); press(key); }
});

// keys are buttons, so Enter and Space reach them through the keyboard
board.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const k = e.target.closest(".wkey,.bkey");
  if (!k) return;
  e.preventDefault();
  press(k);
});

/* ------------------------- resize: drag or tap ----------------------- */
/* Three sizes: hidden, default, expanded. Tap the tab to step between the
   last two; drag it to reach any of them, and it snaps to the nearest. */
const expand = $("expand");
const rack   = $("rack");
const probeA = $("probeA");
const probeB = $("probeB");

const STATES = ["hidden", "default", "open"];
let state = "default";

function isDeck() {
  return matchMedia("(orientation:landscape) and (max-height:620px)").matches;
}

// resolved pixel sizes for the three stops, re-read each time so they stay
// right after a resize or a rotation
function stops() {
  const a = probeA.getBoundingClientRect();
  const b = probeB.getBoundingClientRect();
  return isDeck() ? [0, a.height, b.height] : [0, a.width, b.width];
}

function setState(name) {
  state = name;
  document.body.classList.toggle("keys-hidden", name === "hidden");
  document.body.classList.toggle("keys-open", name === "open");
  expand.setAttribute("aria-expanded", String(name === "open"));
  // the label describes what the next tap will do
  expand.setAttribute("aria-label",
    name === "hidden" ? "Show the keyboard"
    : name === "default" ? "Make the keyboard wider"
                         : "Hide the keyboard");
  const h = document.getElementById("hint");
  if (h) h.innerHTML = name === "hidden"
    ? "\u266A &nbsp;Tap the arrow to play"
    : "\u266A &nbsp;Tap the keys";
  if (typeof fitCard === "function") fitCard();
}

// tapping cycles the three sizes: away -> a little -> wide -> away
const afterTap = s => s === "hidden" ? "default"
                    : s === "default" ? "open"
                    : "hidden";

let drag = null;

/* A finger never lands perfectly still, so the old 5px threshold turned most
   taps into a one-pixel drag that snapped straight back to where it started —
   which is why the tab often looked dead. 14px is past the wobble of a tap. */
const SLOP = 14;

expand.addEventListener("pointerdown", e => {
  e.stopPropagation();
  e.preventDefault();
  try { expand.setPointerCapture(e.pointerId); } catch (err) {}
  const r = rack.getBoundingClientRect();
  const deck = isDeck();
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, deck: deck,
           from: deck ? r.height : r.width, far: 0 };
});

expand.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  const delta = drag.deck ? drag.y - e.clientY : e.clientX - drag.x;
  drag.far = Math.max(drag.far, Math.abs(delta));
  if (drag.far < SLOP) return;

  const max = stops()[2];
  const size = Math.max(0, Math.min(max, drag.from + delta));
  document.body.classList.add("rack-dragging");
  document.documentElement.style.setProperty(
    drag.deck ? "--drag-h" : "--drag-w", size + "px");
});

function endDrag(e) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  const moved = drag.far >= SLOP, deck = drag.deck;
  drag = null;
  document.body.classList.remove("rack-dragging");

  if (!moved) {                       // a tap, not a drag
    setState(afterTap(state));
    return;
  }
  const r = rack.getBoundingClientRect();
  const now = deck ? r.height : r.width;
  let best = 0;
  stops().forEach((v, i) => {
    if (Math.abs(v - now) < Math.abs(stops()[best] - now)) best = i;
  });
  setState(STATES[best]);
}

expand.addEventListener("pointerup", endDrag);
expand.addEventListener("pointercancel", endDrag);

// keyboard activation (Enter/Space) arrives as a click with no pointer detail
expand.addEventListener("click", e => {
  e.stopPropagation();
  if (e.detail === 0) setState(afterTap(state));
});

window.addEventListener("keydown", e => {
  if (e.key === "Escape" && state !== "hidden") setState("hidden");
});

/* ------------------- keep the card on one screen --------------------- */
/* The layout is tuned to fit a phone without scrolling. On a very short
   screen, or once a long venue name wraps, this scales the card down the
   last few percent rather than letting it spill into a scroll. */
const panel = $("panel");
const inner = document.querySelector(".inner");

function fitCard() {
  inner.style.transform = "";
  inner.style.height = "";
  if (isDeck()) return;                 // the bottom-deck layout may scroll

  const cs = getComputedStyle(panel);
  const room = innerHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const need = inner.getBoundingClientRect().height;
  if (need <= room) return;

  // scale() alone leaves the layout box full height and the page still
  // scrolls, so the box is pinned to the scaled height as well
  const k = Math.max(0.7, room / need);
  inner.style.transform = "scale(" + k.toFixed(4) + ")";
  inner.style.height = (need * k) + "px";
}

addEventListener("resize", fitCard);
addEventListener("orientationchange", () => setTimeout(fitCard, 120));
rack.addEventListener("transitionend", e => {
  if (e.propertyName === "width" || e.propertyName === "height") fitCard();
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitCard);
fitCard();
setState("default");       // the keys show from the start, or nobody finds them

/* ----------------------- draw on the card ---------------------------- */
/* Press and drag anywhere on the card and it takes a brass mark that fades
   by itself. Segments carry the moment they were made, so the canvas never
   has to be wiped by hand, and the loop stops once the last one has gone. */
const trail = $("trail");
const tctx = trail.getContext("2d");
const calm = matchMedia("(prefers-reduced-motion: reduce)");

const LIFE = 2000;                     // how long a mark lasts, in ms
const GLYPHS = ["\u266A", "\u266B", "\u2669", "\u266C"];

let segs = [], notes = [], loop = 0;
let inking = false, px = 0, py = 0, lastNote = 0;
let cw = 0, ch = 0, ox = 0, oy = 0;

/* Everything is measured from the canvas's own box. innerWidth/innerHeight
   are not the same thing: they include a desktop scrollbar, and on a phone
   they shrink with the address bar while a fixed element keeps the taller
   viewport. Sizing the backing store from those stretched the canvas, which
   is what pushed the marks down and to the right of the finger. */
function sizeTrail() {
  const r = trail.getBoundingClientRect();
  if (!r.width || !r.height) return;
  ox = r.left; oy = r.top;
  cw = r.width; ch = r.height;

  const dpr = Math.min(2, window.devicePixelRatio || 1);
  trail.width = Math.round(cw * dpr);
  trail.height = Math.round(ch * dpr);
  // derived from the real backing size, so rounding cannot skew it either
  tctx.setTransform(trail.width / cw, 0, 0, trail.height / ch, 0, 0);
}
sizeTrail();
addEventListener("resize", sizeTrail);
addEventListener("scroll", sizeTrail, { passive: true });
if (window.visualViewport) {
  visualViewport.addEventListener("resize", sizeTrail);
  visualViewport.addEventListener("scroll", sizeTrail);
}
if (typeof ResizeObserver === "function") new ResizeObserver(sizeTrail).observe(trail);

function frame() {
  const now = performance.now();
  tctx.clearRect(0, 0, cw, ch);
  tctx.lineCap = "round";
  tctx.lineJoin = "round";
  let live = 0;

  // clipped to the card, so the keys stay clean however they are sized
  const card = panel.getBoundingClientRect();
  tctx.save();
  tctx.beginPath();
  tctx.rect(card.left - ox, card.top - oy, card.width, card.height);
  tctx.clip();

  /* Two passes: the whole halo first, then the core over all of it. Done
     segment by segment in a single pass, each halo lands on the core laid
     down before it and chops the stroke into dashes. */
  for (let pass = 0; pass < 2; pass++) {
    tctx.strokeStyle = pass ? "#b5a05c" : "rgba(150,128,66,.30)";
    for (const s of segs) {
      const age = (now - s.t) / LIFE;
      if (age >= 1) continue;
      if (!pass) live++;
      const fade = 1 - age;
      tctx.globalAlpha = fade * fade * (pass ? .8 : 1);
      tctx.lineWidth = s.w * (.4 + .6 * fade) * (pass ? 1 : 3);
      tctx.beginPath();
      tctx.moveTo(s.x1, s.y1);
      tctx.lineTo(s.x2, s.y2);
      tctx.stroke();
    }
  }

  // notes shaken loose at the tip of the stroke, drifting up as they go
  for (const n of notes) {
    const age = (now - n.t) / n.life;
    if (age >= 1) continue;
    live++;
    const k = 1 - age;
    tctx.save();
    tctx.globalAlpha = Math.min(1, age * 10) * k * k * .8;
    // eases out, so it clears the fingertip fast and then drifts
    const lift = n.rise * (1 - (1 - age) * (1 - age));
    tctx.translate(n.x + Math.sin(age * 5 + n.phase) * n.sway, n.y - lift);
    tctx.rotate(n.tilt + n.spin * age);
    tctx.font = n.size + "px Georgia, serif";
    tctx.textAlign = "center";
    tctx.textBaseline = "middle";
    tctx.fillStyle = "#ae9a5e";
    tctx.fillText(n.g, 0, 0);
    tctx.restore();
  }

  tctx.restore();
  tctx.globalAlpha = 1;

  if (live) { loop = requestAnimationFrame(frame); return; }
  segs = []; notes = []; loop = 0;      // nothing left — let the loop rest
  tctx.clearRect(0, 0, cw, ch);
}

/* One finger plays the MIDI, two pause it and give you the chord pattern,
   three send it back to the beginning. Change RESET_FINGERS to 4 if you'd
   rather use four; three would then behave like one. */
const RESET_FINGERS = 3;
const fingers = new Set();
let settle = 0, peak = 0;

function playFor(count, vy) {
  if (!song || count === 2) {
    stopSong();                        // two fingers pause it where it stands
    unlatch();
    if (!pulse) startRun(vy);
  } else if (count >= RESET_FINGERS) {
    stopRun();
    unlatch();                         // a fresh start has to earn its latch again
    stopSong();
    songAt = 0;
    startSong();
  } else {
    stopRun();
    if (!songTimer) startSong();       // already running? leave it alone
  }
}

/* Fingers of a multi-touch never land in the same instant, so the decision
   waits a moment for them all to arrive. Otherwise a three-finger tap would
   audibly pass through the two-finger case on its way. */
function decide(vy) {
  clearTimeout(settle);
  settle = setTimeout(() => { settle = 0; playFor(peak, vy); }, 80);
}

// a quick tap can end before the settle fires; play it rather than lose it
function settleNow(vy) {
  if (!settle) return;
  clearTimeout(settle);
  settle = 0;
  playFor(peak, vy);
}

panel.addEventListener("pointerdown", e => {
  if (calm.matches || drag) return;
  // the deck layout scrolls, so a finger there belongs to the page, not the pen
  if (isDeck() && e.pointerType === "touch") return;

  // Resume the audio here, in the gesture handler itself. Browsers only
  // unlock sound from a real touch, and a timer callback no longer counts as
  // one — which is why the first tap used to make no sound at all.
  audio();

  if (!fingers.size) heldFrom = performance.now();
  fingers.add(e.pointerId);
  peak = Math.max(peak, fingers.size);   // counted after the add
  sizeTrail();                          // re-read the box before the first mark
  inking = true; px = e.clientX - ox; py = e.clientY - oy;
  holdY = e.clientY;
  decide(e.clientY);
});

addEventListener("pointermove", e => {
  if (!inking) return;
  const x = e.clientX - ox, y = e.clientY - oy;
  const d = Math.hypot(x - px, y - py);
  if (d < 1.2) return;                  // ignore the jitter of a still finger

  // a quick stroke runs thinner, the way a dragged finger would
  segs.push({ x1: px, y1: py, x2: x, y2: y, t: performance.now(),
              w: Math.max(.9, 3 - d * .13) });
  if (segs.length > 700) segs.splice(0, segs.length - 700);
  px = x; py = y;

  holdY = e.clientY;
  travelled += d;
  if (travelled >= TRAVEL) {            // moved far enough — line up the next chord
    travelled = 0;
    queued = (((queued < 0 ? chordAt : queued) + 1) % CHORDS.length);
  }

  const now = performance.now();

  // the drifting glyphs are much sparser than the notes
  if (now - lastNote > 210 && Math.random() < .6) {
    lastNote = now;
    notes.push({
      x: x, y: y, t: now,
      life: 1600 + Math.random() * 800,
      size: 21 + Math.random() * 13,
      rise: 105 + Math.random() * 65,
      sway: 5 + Math.random() * 9,
      phase: Math.random() * 6.28,
      tilt: (Math.random() - .5) * .6,
      spin: (Math.random() - .5) * .8,
      g: GLYPHS[(Math.random() * GLYPHS.length) | 0]
    });
    if (notes.length > 40) notes.shift();
  }

  if (!loop) loop = requestAnimationFrame(frame);
}, { passive: true });

function stopInk(e) {
  if (e && e.pointerId !== undefined) fingers.delete(e.pointerId);
  else fingers.clear();
  if (fingers.size) return;             // still a finger down
  settleNow(holdY);                     // a tap that ended early still sounds
  peak = 0;
  inking = false;
  stopRun();

  const held = performance.now() - heldFrom;
  if (song && songTimer && held >= LATCH) {
    latched = true;                     // long enough: let the music carry on
    clearTimeout(showTimer);
    showTimer = setTimeout(showPlaying, 1000);
  } else if (!latched) {
    stopSong();
  }
}
addEventListener("pointerup", stopInk);
addEventListener("pointercancel", stopInk);

</script>
</body>
</html>
